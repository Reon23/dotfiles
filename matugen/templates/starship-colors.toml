"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$docker\
$fill\
$battery\
$line_break\
$character\
"""

palette = 'colors'

[palettes.colors]
color1 = '{{colors.primary_fixed_dim.default.hex}}'
color2 = '{{colors.on_primary.default.hex}}'
color3 = '{{colors.on_surface_variant.default.hex}}'
color4 = '{{colors.surface_container.default.hex}}'
color5 = '{{colors.on_primary.default.hex}}'
color6 = '{{colors.surface_dim.default.hex}}'
color7 = '{{colors.surface.default.hex}}'
color8 = '{{colors.primary.default.hex}}'
color9 = '{{colors.tertiary.default.hex}}'

[hostname]
ssh_only = false
format = '[ cherry🍒 ](bold white)'

[directory]
style = "fg:color1"
format = "[at $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
format = '[on $symbol $branch ](fg:color1)'

[git_status]
format = '[($all_status$ahead_behind )](fg:color1)'

[python]
symbol = "󰌠"
style = "fg:color1"
format = 'via [${symbol} ${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[fill]
symbol = " "

[battery]
format = "[ $symbol $percentage](fg:white)"
full_symbol = ""
charging_symbol = "[󱟠](green)"
discharging_symbol = "[󱟞](red)"

[[battery.display]]
threshold = 99

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:blue)'
error_symbol = '[!](bold fg:red)'
